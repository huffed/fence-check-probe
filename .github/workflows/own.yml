name: own-api
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
  checks: write
jobs:
  post:
    name: post a check run
    runs-on: ubuntu-latest
    steps:
      - name: post a successful check run named like the fence, 100 s after the start
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sleep 100
          gh api "repos/$REPO/check-runs" -f name='live-path fence' -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=success --jq '.app.slug + " " + (.id|tostring)'
